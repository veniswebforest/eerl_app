name: eerl_app
description: "EERL App — A production-ready Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Localization
  intl: any

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.4

  # Navigation
  go_router: ^14.8.1
  flutter_svg: ^2.3.0
  image_picker: ^1.2.1
  lottie: ^3.3.3
  http: ^1.6.0
  dotted_border: ^3.1.0
  popover: ^0.4.0
  connectivity_plus: ^6.1.4
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/collection_detail/
    - assets/images/verification/
    - assets/images/stock/
    - assets/images/agent_status/
    - assets/images/profile/
    - assets/images/end_my_day/
    - assets/icons/home/
    - assets/icons/home/supervisor/
    - assets/icons/home/supervisor/drawer/
    - assets/icons/wallet/
    - assets/icons/profile/
    - assets/icons/end_my_day/
    - assets/icons/records/
    - assets/icons/help_support/
    - assets/icons/collection/
    - assets/icons/role_switcher/
    - assets/icons/tasks/
    - assets/icons/supervisor_requests/
    - assets/icons/mrf_person/
    - assets/icons/
    - assets/images/ragpicker_directory/
    - assets/images/tasks/
    - assets/images/supervisor_requests/
    - assets/lottie/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-Regular.ttf
        - asset: assets/font/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Manrope-Light.ttf
          weight: 300
        - asset: assets/font/Manrope-Medium.ttf
          weight: 500
        - asset: assets/font/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/font/Manrope-Bold.ttf
          weight: 700
        - asset: assets/font/Manrope-ExtraBold.ttf
          weight: 800
